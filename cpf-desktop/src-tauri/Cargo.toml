[package]
name = "cpf-desktop"
default-run = "cpf-desktop"
version = "0.1.0"
description = "Console Preservation Framework desktop shell"
edition = "2021"
license = "GPL-3.0-only"
build = "build.rs"

[lib]
name = "cpf_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpf-core = { path = "../crates/cpf-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
rfd = { version = "0.16", default-features = false }
base64 = "0.22"

