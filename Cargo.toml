[package]
name = "cpf"
version = "0.1.0"
edition = "2021"
description = "Local-only console preservation inventory and 3DS-family loader groundwork"
default-run = "cpf"

[features]
default = ["public-release"]
public-release = []

[dependencies]
sha2 = "0.10.9"
png = "=0.17.16"
toml = "=1.1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
png = "=0.17.16"
ico = "=0.5.0"
embed-resource = "=3.0.12"
